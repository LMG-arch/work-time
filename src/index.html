<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上班日历</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="social.css">
  <!-- 入口：通过 Vite 正式 ESM module 加载（bootstrap.js）。
       vue-main.js 及其整条依赖链（shared.js → shims.js → Vue/组件/stores）
       会被 Vite 正确打包为 dist/assets/ 下的 chunk 文件。
       错误捕获在 bootstrap.js 内用 import().catch() 处理，显示到诊断面板。 -->
  <script type="module" src="./bootstrap.js"></script>
</head>
<body>
  <!-- 🔍 启动诊断面板：纯内联，不依赖任何外部 JS/CSS -->
  <div id="boot-diag"
    style="position:fixed;top:0;left:0;right:0;z-index:999999;
           background:rgba(0,0,0,0.75);color:#7ee787;
           font:12px/1.6 -apple-system,'SF Pro Text',system-ui,sans-serif;
           padding:6px 14px;box-sizing:border-box;
           border-bottom:1px solid rgba(125,207,255,0.3);
           backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           pointer-events:none;transition:opacity 0.8s ease;
           display:flex;align-items:center;gap:8px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ee787;flex-shrink:0;" id="boot-dot"></span>
    <span id="boot-text">Initializing...</span>
  </div>
  <script>
    // ===== 启动诊断核心（在任何模块执行前就绪）=====
    var _bootSteps = [];
    var _bootErr = null;

    // 🔍 协议检测：file:// 协议无法加载 ESM 模块（浏览器安全限制），立即提示
    if (location.protocol === 'file:') {
      _bootErr = 'FILE_PROTOCOL_BLOCKED';
      document.getElementById('boot-text').textContent =
        '[WARN] Opened via file:// — ESM modules blocked by browser. Please use the launcher bat or start with "npm run dev".';
      document.getElementById('boot-text').style.color = '#f0883e';
      document.getElementById('boot-dot').style.background = '#f0883e';
      var diag = document.getElementById('boot-diag');
      if (diag) {
        diag.style.borderBottomColor = 'rgba(240,136,62,0.6)';
        diag.style.background = 'rgba(240,136,62,0.15)';
      }
      console.warn('[BOOT] File protocol detected — dynamic import() will be blocked by browser security policy');
    }

    window.__bootLog = function(msg) {
      _bootSteps.push(msg);
      var el = document.getElementById('boot-text');
      var dot = document.getElementById('boot-dot');
      if (el) el.textContent = msg + ' | ' + new Date().toLocaleTimeString();
      console.log('[BOOT]', msg);
      // 成功完成时自动淡化（3秒后）
      if (msg.indexOf('all data loaded') >= 0 || msg.indexOf('OK') >= 0) {
        var diag = document.getElementById('boot-diag');
        if (dot) dot.style.background = '#3fb950';
        setTimeout(function() { if (diag) diag.style.opacity = '0'; }, 3000);
        setTimeout(function() { if (diag) diag.style.display = 'none'; }, 4000);
      }
    };
    window.__bootError = function(msg) {
      _bootErr = msg;
      var el = document.getElementById('boot-text');
      var dot = document.getElementById('boot-dot');
      var diag = document.getElementById('boot-diag');
      if (el) { el.textContent = '[ERROR] ' + msg; el.style.color='#f85149'; }
      if (dot) dot.style.background = '#f85149';
      if (diag) {
        diag.style.borderBottomColor = 'rgba(248,81,73,0.6)';
        diag.style.background = 'rgba(248,81,73,0.12)';
      }
      console.error('[BOOT ERROR]', msg);
    };

    // 捕获全局 JS 错误（模块加载失败、语法错误等都会触发）
    window.addEventListener('error', function(e) {
      var msg = (e.message || '') + '';
      if (msg.indexOf('Failed to fetch dynamically imported module') >= 0 ||
          msg.indexOf('Failed to load module script') >= 0 ||
          msg.indexOf('Loading module script') >= 0 ||
          msg.indexOf('Loading CSS') >= 0) {
        window.__bootError('Module load failed: ' + msg);
      }
    });
    // 捕获 unhandled promise rejection
    window.addEventListener('unhandledrejection', function(e) {
      window.__bootError('Promise rejected: ' + (e.reason ? e.reason.message || e.reason : 'unknown'));
    });

    // 模块脚本超时检测：如果 8 秒内 vue-main.js 没有输出任何日志，说明模块没加载
    setTimeout(function() {
      if (_bootSteps.length <= 1) { // 只有初始的 "DOM ready" 一条
        window.__bootError('Module script did not execute within 8s — checking...');
        // 主动探测：尝试 fetch 模块文件本身
        fetch('./vue-main.js', { method: 'HEAD', cache: 'no-store' })
          .then(function(r) {
            if (location.protocol === 'file:') {
              window.__bootError('Module file exists but file:// protocol blocks ESM execution. Start with "npm run dev" (Vite dev server).');
            } else {
              window.__bootError('Module fetchable (status=' + r.status + ', type=' + (r.headers.get('content-type')||'?') + ') but did not EXECUTE — likely blocked by CSP/script-src for modules');
            }
          })
          .catch(function(e) {
            var detail = e.message || String(e);
            if (location.protocol === 'file:') {
              detail = 'file:// protocol — browser security prevents module loading. Use "npm run dev" to start via Vite.';
            }
            window.__bootError('Module fetch FAILED: ' + detail + ' — network/CSP/protocol blocking');
          });
      }
    }, 8000);

    window.__bootLog('DOM ready, loading modules...');
  </script>

  <!-- Vue SPA 根：默认即可见（由启动闪屏覆盖加载过程），不再依赖 renderer.js 异步初始化来揭开 -->
  <div id="app" style="min-height:calc(100vh - 70px);background:var(--bg,#fff);"></div>

  <!-- 星海绽放主题：右上角开花标记（仅 cosmic 主题显示） -->
  <div class="bloom-mark" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <g class="bloom-petals" fill="#ff8fab">
        <ellipse cx="50" cy="26" rx="13" ry="22"/>
        <ellipse cx="50" cy="26" rx="13" ry="22" transform="rotate(72 50 50)"/>
        <ellipse cx="50" cy="26" rx="13" ry="22" transform="rotate(144 50 50)"/>
        <ellipse cx="50" cy="26" rx="13" ry="22" transform="rotate(216 50 50)"/>
        <ellipse cx="50" cy="26" rx="13" ry="22" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="12" fill="#ffd166"/>
    </svg>
  </div>

  <script src="lib/supabase.min.js"></script>
  <!-- 过渡恢复：补全账号 lmg 的密码重置 salt（见 src/public/salt-seed.js 说明），使重装后可正常登录并同步云端数据 -->
  <script src="./salt-seed.js"></script>
  <!-- storage.js / utils.js / holidays.js / lunar.js 已迁移为 ES 模块，由 vue-main.js 经 shared.js + shims.js 导入 -->
  <!-- web-api.js 已迁移为 ES 模块（src/electron/api.js），由 vue-main.js 经 shims.js 导入并设置 window.calendarAPI -->
  <!-- supabase-core.js / supabase-social.js / supabase-sync.js 已迁移为 ES 模块（src/supabase/*），由 vue-main.js 经 shims.js 导入并挂回 window.* -->
  <!-- calendar/todos/stats/social/reminders/settings/updater/renderer 已迁移为 ES 模块，由 vue-main.js 经 shared.js + shims.js 导入并挂回 window.* -->
</body>
</html>
